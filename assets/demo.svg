<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" xml:space="preserve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset="1" stop-color="#1f1a33"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <text x="64" y="78" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Use Claude Code from inside Codex</text>
  <text x="64" y="112" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#b9b3d6">Four Codex skills that drive the claude CLI you already have. No API key. Read-only by default.</text>

  <g transform="translate(64 150)" filter="url(#shadow)">
    <rect width="1152" height="430" rx="14" fill="#0f0e17" stroke="#2c2744"/>
    <rect width="1152" height="36" rx="14" fill="#1a1828"/>
    <rect y="22" width="1152" height="14" fill="#1a1828"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="18" r="6" fill="#febc2e"/>
    <circle cx="62" cy="18" r="6" fill="#28c840"/>
    <text x="576" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8d87ad">codex — my-repo</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e8e6f2">
      <text x="28" y="76"><tspan fill="#28c840">›</tspan><tspan x="48">$claude-task explain how login sessions are refreshed</tspan></text>
      <text x="28" y="116" fill="#8d87ad"><tspan>•</tspan><tspan x="48">Running </tspan><tspan fill="#c9a6ff">claude -p</tspan><tspan> via claude-companion (permission: read)…</tspan></text>
      <text x="48" y="162"><tspan>Refresh happens in </tspan><tspan fill="#7ee0ff">src/auth/session.ts:41</tspan><tspan>. Every request calls</tspan></text>
      <text x="48" y="190">ensureFresh(), which re-issues the token 60 s before expiry</text>
      <text x="48" y="218"><tspan>and stores it through </tspan><tspan fill="#7ee0ff">SessionStore.save()</tspan><tspan>. One risk: the refresh</tspan></text>
      <text x="48" y="246">is not awaited on the logout path, so a stale token can be</text>
      <text x="48" y="274"><tspan>written after sign-out (</tspan><tspan fill="#7ee0ff">logout.ts:18</tspan><tspan>).</tspan></text>
      <text x="48" y="320" fill="#8d87ad">claude session 41ec7d2a · 6 turns · $0.08 · resume with --resume</text>
      <text x="28" y="370"><tspan fill="#28c840">›</tspan><tspan x="48">$claude-task --resume --write fix the logout race and add a test</tspan></text>
      <text x="28" y="408" fill="#8d87ad"><tspan>•</tspan><tspan x="48">Continuing session 41ec7d2a (permission: write)…</tspan></text>
    </g>
  </g>
</svg>
